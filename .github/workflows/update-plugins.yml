---
name: update-plugins

# Renovate can bump a version string but cannot maintain the matching
# checksums, so the lock file is regenerated by its own script instead.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Regenerate plugins.lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./hack/update-plugins.sh

      - name: Summarise changes
        id: diff
        run: |
          if git diff --quiet -- plugins.lock; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >>"$GITHUB_OUTPUT"
          # Write the body to a file rather than interpolating version strings
          # into shell or YAML.
          {
            echo "Regenerated by \`hack/update-plugins.sh\`."
            echo
            echo '| plugin | old | new |'
            echo '| --- | --- | --- |'
            git show HEAD:plugins.lock >old.lock
            awk 'NR==FNR { if ($0 !~ /^#/) old[$2]=$3; next }
                 !/^#/ && old[$2] != $3 {
                   printf "| %s | %s | %s |\n", $2, (old[$2] ? old[$2] : "-"), $3
                 }' old.lock plugins.lock
            echo
            echo 'The build will not merge green unless both images boot with every addon ENABLED.'
          } >pr-body.md
          rm -f old.lock

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-plugins
          title: "chore: update BentoBox plugin versions"
          body-path: pr-body.md
          commit-message: "chore: update BentoBox plugin versions"
          add-paths: plugins.lock
          delete-branch: true
